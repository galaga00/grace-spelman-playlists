name: Publish playlist directory

on:
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - app.js
      - playlists.json
      - robots.txt
      - .nojekyll
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the directory
        uses: actions/checkout@v4

      - name: Prepare the static site
        run: |
          mkdir _site
          cp index.html styles.css app.js playlists.json robots.txt .nojekyll _site/

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

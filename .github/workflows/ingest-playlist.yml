name: Add a completed playlist

on:
  repository_dispatch:
    types: [playlist_created]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: playlist-ingest
  cancel-in-progress: false

jobs:
  update-directory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the directory
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Add or update the playlist
        env:
          PLAYLIST_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: node scripts/upsert-playlist.mjs

      - name: Validate playlist data
        run: node scripts/validate-data.mjs

      - name: Commit an actual change
        run: |
          if git diff --quiet -- playlists.json; then
            echo "Playlist data already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlists.json
          git commit -m "data: add completed Spotify playlist"
          git push

  deploy:
    needs: update-directory
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the updated directory
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare the static site
        run: |
          mkdir _site
          cp index.html styles.css app.js playlists.json robots.txt .nojekyll _site/

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
